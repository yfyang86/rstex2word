name: Publish

# Publishes the workspace crates (all but the unpublished tex2word-goldens) to
# crates.io when a version tag is pushed (e.g. `v2.0.0`), or on manual
# dispatch. Crates are published leaf-first so each one's version dependencies
# already exist on the registry.
#
# The publish step is idempotent and rate-limit-aware, so it is safe to re-run:
#   * a crate already on crates.io at this version is skipped, and
#   * crates.io's new-crate rate limit (HTTP 429) is waited out and retried.
# This matters on a first publish, where crates.io throttles new crate names
# (a burst of a few, then ~1 per 10 minutes).
#
# Requires a repository secret `CARGO_REGISTRY_TOKEN` (Settings → Secrets and
# variables → Actions), a crates.io API token with publish scope.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the workspace before publishing
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail

          # Publish one crate, tolerating "already published", waiting out
          # crates.io's new-crate rate limit (HTTP 429), and waiting for the
          # crates.io index to show a just-published dependency (the index is
          # updated by a background job and served through a CDN, so a new
          # version can take several minutes to become resolvable).
          publish_one() {
            local crate="$1"
            local rate_limited=0 index_waits=0 attempt=0
            while true; do
              attempt=$((attempt + 1))
              echo "::group::publish $crate (attempt $attempt)"
              local out rc
              out="$(cargo publish -p "$crate" 2>&1)"; rc=$?
              echo "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                echo "::notice::published $crate"
                return 0
              fi
              if printf '%s' "$out" | grep -qiE 'already (uploaded|exists)|already been published'; then
                echo "::notice::$crate is already on crates.io at this version, skipping"
                return 0
              fi
              if printf '%s' "$out" | grep -qiE '429|too many requests'; then
                rate_limited=$((rate_limited + 1))
                if [ "$rate_limited" -gt 6 ]; then
                  echo "::error::gave up publishing $crate after repeated rate limits"
                  return 1
                fi
                echo "::warning::rate limited publishing $crate; waiting 11 minutes then retrying"
                sleep 660
                continue
              fi
              if printf '%s' "$out" | grep -qiE 'failed to select a version for the requirement'; then
                index_waits=$((index_waits + 1))
                if [ "$index_waits" -gt 30 ]; then
                  echo "::error::a dependency of $crate never appeared in the crates.io index"
                  return 1
                fi
                echo "::warning::a dependency of $crate is not in the crates.io index yet; waiting 60 seconds"
                sleep 60
                continue
              fi
              echo "::error::failed to publish $crate"
              return 1
            done
          }

          for crate in \
            tex2word-ir \
            tex2word-ooxml \
            tex2word-latexwalker \
            tex2word-math \
            tex2word-bib \
            tex2word-latex \
            tex2word-validate \
            tex2word-frontend \
            tex2word-backend \
            tex2word \
            tex2word-cli; do
            publish_one "$crate" || exit 1
          done
