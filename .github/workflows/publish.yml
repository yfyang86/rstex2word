name: Publish

# Publishes all workspace crates to crates.io when a version tag is pushed
# (e.g. `v1.0.6`), or on manual dispatch. Crates are published leaf-first so
# each one's version dependencies already exist on the registry.
#
# The publish step is idempotent and rate-limit-aware, so it is safe to re-run:
#   * a crate already on crates.io at this version is skipped, and
#   * crates.io's new-crate rate limit (HTTP 429) is waited out and retried.
# This matters on a first publish, where crates.io throttles new crate names
# (a burst of a few, then ~1 per 10 minutes).
#
# Requires a repository secret `CARGO_REGISTRY_TOKEN` (Settings → Secrets and
# variables → Actions), a crates.io API token with publish scope.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the workspace before publishing
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail

          # Publish one crate, tolerating "already published" and waiting out
          # crates.io's new-crate rate limit (HTTP 429).
          publish_one() {
            local crate="$1"
            local attempt
            for attempt in $(seq 1 6); do
              echo "::group::publish $crate (attempt $attempt)"
              local out rc
              out="$(cargo publish -p "$crate" 2>&1)"; rc=$?
              echo "$out"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                echo "::notice::published $crate"
                return 0
              fi
              if printf '%s' "$out" | grep -qiE 'already (uploaded|exists)|already been published'; then
                echo "::notice::$crate is already on crates.io at this version, skipping"
                return 0
              fi
              if printf '%s' "$out" | grep -qiE '429|too many requests'; then
                echo "::warning::rate limited publishing $crate; waiting 11 minutes then retrying"
                sleep 660
                continue
              fi
              echo "::error::failed to publish $crate"
              return 1
            done
            echo "::error::gave up publishing $crate after repeated rate limits"
            return 1
          }

          for crate in \
            tex2word-ir \
            tex2word-math \
            tex2word-frontend \
            tex2word-backend \
            tex2word-latex \
            tex2word-validate \
            tex2word \
            tex2word-cli; do
            publish_one "$crate" || exit 1
          done
