name: Publish

# Publishes all workspace crates to crates.io when a version tag is pushed
# (e.g. `v1.0.6`). Crates are published leaf-first so each one's path/version
# dependencies already exist on the registry; modern cargo waits for the index
# to update between publishes.
#
# Requires a repository secret `CARGO_REGISTRY_TOKEN` (Settings → Secrets and
# variables → Actions), a crates.io API token with publish scope.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the workspace before publishing
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in \
            tex2word-ir \
            tex2word-math \
            tex2word-frontend \
            tex2word-backend \
            tex2word-latex \
            tex2word-validate \
            tex2word \
            tex2word-cli; do
            echo "::group::publish $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done
