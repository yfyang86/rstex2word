[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Yifan Yang <yfyang.86@hotmail.com>"]
repository = "https://github.com/yfyang86/rstex2word"
homepage = "https://github.com/yfyang86/rstex2word"
description = "LaTeX -> Microsoft Word (.docx) converter with native OMML math (Rust)"
keywords = ["latex", "docx", "ooxml", "converter", "math"]
categories = ["command-line-utilities", "text-processing"]

# Inter-crate dependencies declared once, with both a path (for local builds)
# and a version (required by `cargo publish`). Members opt in with
# `<crate>.workspace = true`. Listed in publish (dependency) order.
[workspace.dependencies]
tex2word-ir = { path = "crates/tex2word-ir", version = "2.4.0" }
tex2word-ooxml = { path = "crates/tex2word-ooxml", version = "2.4.0" }
tex2word-latexwalker = { path = "crates/tex2word-latexwalker", version = "2.4.0" }
tex2word-math = { path = "crates/tex2word-math", version = "2.4.0" }
tex2word-bib = { path = "crates/tex2word-bib", version = "2.4.0" }
tex2word-frontend = { path = "crates/tex2word-frontend", version = "2.4.0" }
tex2word-backend = { path = "crates/tex2word-backend", version = "2.4.0" }
tex2word-latex = { path = "crates/tex2word-latex", version = "2.4.0" }
tex2word-validate = { path = "crates/tex2word-validate", version = "2.4.0" }
tex2word = { path = "crates/tex2word", version = "2.4.0" }

[profile.release]
opt-level = 3
lto = true
